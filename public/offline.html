<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#C1502E" />
    <title>Sem internet · Ordens OS</title>
    <link rel="icon" href="/icon-192" />
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
        background: #edefe8;
        color: #1f2a2e;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      main { max-width: 360px; }
      .stamp {
        display: inline-flex;
        width: 56px;
        height: 56px;
        align-items: center;
        justify-content: center;
        border: 3px solid #c1502e;
        border-radius: 4px;
        color: #c1502e;
        font-weight: 700;
        font-size: 20px;
      }
      h1 { margin: 20px 0 8px; font-size: 22px; }
      p { margin: 0 0 12px; color: #4b5a5c; font-size: 15px; line-height: 1.45; }
      button {
        margin-top: 12px;
        width: 100%;
        padding: 14px 16px;
        border: 2px solid #9c3d22;
        border-radius: 2px;
        background: #c1502e;
        color: #fff;
        font-size: 16px;
        font-weight: 700;
        text-transform: uppercase;
      }
      .sos {
        margin-top: 20px;
        padding: 12px;
        border: 2px solid #c9ccc1;
        background: #e3e5dc;
        font-size: 13px;
        color: #1f2a2e;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="stamp">OS</div>
      <h1>Sem internet</h1>
      <p>Não foi possível carregar esta tela. Suas ordens já registradas continuam salvas no servidor.</p>
      <button type="button" onclick="location.reload()">Tentar de novo</button>
      <div class="sos">
        🆘 O <strong>APOIO DROP</strong> precisa de internet para avisar a equipe.
        Sem sinal, ligue direto para um colega.
      </div>
    </main>
    <script>
      // Volta sozinho quando a conexão retorna.
      window.addEventListener("online", function () {
        location.reload();
      });
    </script>
  </body>
</html>
